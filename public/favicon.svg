<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Warm Champagne Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="35%" stop-color="#D9B48F" />
      <stop offset="100%" stop-color="#8C6339" />
    </linearGradient>

    <!-- Glow Filter for Sparkle & Play Core -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dark Luxury Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1C1814" />
      <stop offset="100%" stop-color="#0A0908" />
    </radialGradient>
  </defs>

  <!-- Base Squircle Box -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="12" />

  <!-- Subtle Inner Framing Line -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.3" />

  <!-- Cinematic Viewfinder Brackets (4 Corners) -->
  <!-- Top-Left Bracket -->
  <path d="M 120 170 L 120 130 Q 120 120 130 120 L 170 120" stroke="url(#gold-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right Bracket -->
  <path d="M 342 120 L 382 120 Q 392 120 392 130 L 392 170" stroke="url(#gold-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left Bracket -->
  <path d="M 120 342 L 120 382 Q 120 392 130 392 L 170 392" stroke="url(#gold-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right Bracket -->
  <path d="M 342 392 L 382 392 Q 392 392 392 382 L 392 342" stroke="url(#gold-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Play Core Circle + Play Icon -->
  <circle cx="256" cy="256" r="88" fill="#120F0C" stroke="url(#gold-grad)" stroke-width="8" filter="url(#gold-glow)" />
  <polygon points="236,216 236,296 300,256" fill="url(#gold-grad)" />

  <!-- AI Sparkle 4-Point Star (Top Right Accent) -->
  <g transform="translate(365, 145)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#gold-grad)" />
  </g>

  <!-- AI Sparkle Small Star (Bottom Left Accent) -->
  <g transform="translate(145, 365) scale(0.6)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#gold-grad)" opacity="0.85" />
  </g>
</svg>
